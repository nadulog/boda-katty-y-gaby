<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4b561c" />
    <meta name="description" content="Invitación de boda de Gaby y Katty — 12 de diciembre de 2026." />
    <title>Gaby & Katty · Nuestra boda</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="invitation" aria-label="Invitación de boda de Gaby y Katty">
      <section class="panel cover" aria-label="Portada">
        <img src="1.webp" alt="Nuestra boda: Gaby y Katty, 12 de diciembre de 2026" />
      </section>

      <section class="panel guest-panel" aria-label="Invitación para invitados">
        <img src="2.webp" alt="Esta invitación fue creada especialmente para nuestros invitados" />
        <p id="guest-name" class="guest-name" aria-live="polite"></p>
      </section>

      <section class="panel countdown-panel" aria-label="Cuenta regresiva">
        <img src="3.webp" alt="Cuenta regresiva para la boda" />
        <div class="countdown" aria-live="polite" aria-label="Tiempo restante hasta la boda">
          <span><b id="days">00</b><small>días</small></span>
          <span><b id="hours">00</b><small>horas</small></span>
          <span><b id="minutes">00</b><small>minutos</small></span>
          <span><b id="seconds">00</b><small>segundos</small></span>
        </div>
      </section>

      <section class="panel date-panel" aria-label="Fecha y hora">
        <img src="4.webp" alt="Sábado 12 de diciembre de 2026, de 19:00 a 06:00 horas" />
        <a class="hotspot calendar-link" href="boda-gaby-katty.ics" download aria-label="Agregar la boda al calendario"></a>
      </section>

      <section class="panel location-panel" aria-label="Cómo llegar">
        <img src="5.webp" alt="Cómo llegar a Complejo La Masia" />
        <a class="hotspot location-link" href="https://www.google.com/maps/search/?api=1&amp;query=Complejo%20La%20Masia" target="_blank" rel="noopener" aria-label="Ver ubicación de Complejo La Masia en Google Maps"></a>
      </section>

      <section class="panel" aria-label="Información adicional">
        <img src="6.webp" alt="Información adicional de la boda" />
      </section>

      <section class="gallery" aria-labelledby="gallery-title">
        <div class="gallery__heading">
          <span>Gaby & Katty</span>
          <h2 id="gallery-title">Nuestra historia</h2>
          <p>Un pedacito de nosotros.</p>
        </div>
        <div class="gallery__grid">
          <button class="gallery__item" type="button" data-gallery-index="0"><img src="gallery/gallery-01.webp" alt="Gaby y Katty junto a un árbol" /></button>
          <button class="gallery__item" type="button" data-gallery-index="1"><img src="gallery/gallery-02.webp" alt="Gaby y Katty besándose" loading="lazy" /></button>
          <button class="gallery__item" type="button" data-gallery-index="2"><img src="gallery/gallery-03.webp" alt="Gaby y Katty riendo juntos" loading="lazy" /></button>
          <button class="gallery__item" type="button" data-gallery-index="3"><img src="gallery/gallery-04.webp" alt="Retrato de Gaby y Katty" loading="lazy" /></button>
          <button class="gallery__item" type="button" data-gallery-index="4"><img src="gallery/gallery-05.webp" alt="Gaby y Katty junto a un árbol" loading="lazy" /></button>
          <button class="gallery__item" type="button" data-gallery-index="5"><img src="gallery/gallery-06.webp" alt="Gaby y Katty abrazados" loading="lazy" /></button>
          <button class="gallery__item" type="button" data-gallery-index="6"><img src="gallery/gallery-07.webp" alt="Gaby y Katty con luz entre los árboles" loading="lazy" /></button>
          <button class="gallery__item gallery__item--wide" type="button" data-gallery-index="7"><img src="gallery/gallery-08.webp" alt="Gaby y Katty besándose en blanco y negro" loading="lazy" /></button>
          <button class="gallery__item" type="button" data-gallery-index="8"><img src="gallery/gallery-09.webp" alt="Gaby y Katty entre los árboles" loading="lazy" /></button>
          <button class="gallery__item" type="button" data-gallery-index="9"><img src="gallery/gallery-10.webp" alt="Gaby y Katty mirándose" loading="lazy" /></button>
          <button class="gallery__item" type="button" data-gallery-index="10"><img src="gallery/gallery-11.webp" alt="Gaby y Katty tomados de la mano" loading="lazy" /></button>
          <button class="gallery__item gallery__item--wide" type="button" data-gallery-index="11"><img src="gallery/gallery-12.webp" alt="Gaby y Katty besándose" loading="lazy" /></button>
          <button class="gallery__item gallery__item--wide" type="button" data-gallery-index="12"><img src="gallery/gallery-13.webp" alt="Gaby y Katty frente a las montañas" loading="lazy" /></button>
        </div>
      </section>

      <section class="panel" aria-label="Música">
        <img src="7.webp" alt="Música: ayudanos a armar la playlist" />
      </section>

      <section class="panel" aria-label="Información adicional">
        <img src="8.webp" alt="Información adicional de la boda" />
      </section>

      <section class="panel" aria-label="Información adicional">
        <img src="9.webp" alt="Información adicional de la boda" />
      </section>
    </main>
    <dialog class="lightbox" aria-label="Galería de fotos">
      <button class="lightbox__close" type="button" aria-label="Cerrar galería">×</button>
      <button class="lightbox__nav lightbox__nav--previous" type="button" aria-label="Foto anterior">‹</button>
      <img class="lightbox__image" alt="" />
      <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Foto siguiente">›</button>
    </dialog>
    <script src="script.js"></script>
  </body>
</html>
